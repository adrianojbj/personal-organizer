name = "meu-dia"
main = "src/worker.js"
compatibility_date = "2026-10-01"
account_id = "20bd3f351bc5b5c5621206b25fbc5005"

# Página estática (public/) servida pelo próprio Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Banco SQLite gratuito (Cloudflare D1). Criado com `npm run db:create`.
[[d1_databases]]
binding = "DB"
database_name = "meu-dia"
database_id = "5cc5c19c-c013-45ad-b175-a80dab53bb15"
migrations_dir = "migrations"

# Verifica lembretes a cada minuto.
[triggers]
crons = ["* * * * *"]

[vars]
TZ = "America/Sao_Paulo"
DAILY_SUMMARY_TIME = "08:00"   # resumo diário no Slack; deixe "" para desligar
APP_URL = "https://meu-dia.adrianojbj.workers.dev"
SLACK_INTERACTIVE = "true"     # botões Concluir/Adiar nas DMs (o Slack chama /slack/interactions)

# Segredos (nunca no git), via `npx wrangler secret put NOME`:
#   APP_PASSWORD, SESSION_SECRET (login)
#   SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET, SLACK_USER_ID (lembretes no Slack)
